name: 合约安全测试 + Gas 回归门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: forge test -vvv

      - name: Gas snapshot (current)
        run: forge snapshot --check
        continue-on-error: true

      - name: Check gas diff vs main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          git checkout origin/main -- .gas-snapshot 2>/dev/null || echo "No baseline snapshot yet"
          forge snapshot --diff
